# AI Novel Analyzer - 默认配置文件
# 此文件包含所有必需的配置项，用户可以在 production.yaml 中覆盖

# ========== Workspace 配置 ==========
workspace:
  # 工作区根目录：所有项目/书籍/数据的存放根
  root: "workspace"
  # 项目集合目录（缺省由 root/projects 推导）
  projects_dir: "workspace/projects"

# ========== 数据库配置 ==========
db:
  # 数据库存放目录
  path: "workspace/db"
  
  # SQLite 数据库文件
  sqlite_db: "novel_analyzer.db"
  
  # ChromaDB 向量存储
  chromadb_dir: "chromadb"

# ========== 处理配置 ==========
processing:
  # Chapter processing
  max_workers: 1                    # Parallel processing threads
  retry_on_failure: true            # Auto-retry on errors
  continue_on_error: true           # Continue batch if chapter fails
  
  # Chapter retry configuration (range 1-5)
  chapter_retry_attempts: 3         # Max retry attempts for JSON parsing failure (1-5, defaults to 3)
  skip_chapter_on_max_retries: true # If true: skip failed chapter and continue; if false: stop entire batch
  
  # Token management
  max_tokens_per_chapter: 8192      # Maximum tokens in input
  token_margin: 0.1                 # Safety margin (10%)
  
  # JSON validation
  strict_validation: true           # Enforce schema compliance
  allow_partial_results: false      # Accept incomplete results

# ========== AI API 配置 ==========
ai_api:
  # 提供者选项：siliconflow | openai | local | azure
  provider: "siliconflow"
  
  # API 基础 URL（根据提供者调整）
  base_url: "https://api.siliconflow.cn/v1"
  
  # API Key（推荐通过环境变量或 production.yaml 设置）
  # api_key: "sk-xxx"  # 不推荐直接写在这里
  
  # 模型设置
  model: "deepseek-v4"
  
  # Token 控制
  max_tokens: 32768           # AI 生成的最大 Token 数（章节分析等主任务）
  aux_max_tokens: 4096        # 辅助任务最大 Token 数（卷总结、摘要压缩等）
  temperature: 0.7            # 生成温度（0-2 之间）
  
  # 流式调用参数
  stream: true                # 是否启用 SSE 流式响应

# ========== 日志配置 ==========
logging:
  # 日志级别：DEBUG | INFO | WARNING | ERROR | CRITICAL
  level: "INFO"
  
  # 日志目录
  log_dir: "logs"
  
  # API 原始请求/响应落盘（调试用）
  # 开启后，每次 LLM 调用的完整 prompt 和 raw output 会写入 logs/debug/ 目录
  # 文件命名：chap_XXXX_request.txt / chap_XXXX_response.txt
  debug_api_dump: false
  
  # 日志轮转配置
  max_bytes: 10485760         # 10MB
  backup_count: 5             # 保留 5 个备份文件
  
  # 格式配置
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 文件/控制台输出（批处理日志）
  file:
    enabled: true
    path: "./logs/batch_processing.log"
    max_size_mb: 10
    backup_count: 5
  
  console:
    enabled: true

# ========== 章节分割配置 ==========
chapter_splitting:
  # 章节标题正则列表（按顺序匹配，命中即认为该行是章节标题）
  # 每条正则必须包含两个捕获组: group(1)=章节编号, group(2)=标题后缀
  # 默认仅含中文模式，英文小说可自行添加
  title_patterns:
    - '^\s*第\s*([0-9０-９]+|[零一二两三四五六七八九十百千万亿]+)\s*[章节回部集篇]\s*[::\s]?\s*(.{0,60})\s*$'
    - '^\s*[章节回]\s*([0-9０-９]+|[零一二两三四五六七八九十百千万亿]+)\s*[::\s]?\s*(.{0,60})\s*$'
    - '^\s*(\d{1,4})\s*[.、．,，]\s*(.{1,60})\s*$'
    - '^\s*(序章|楔子|引子|终章|尾声|番外|后记|前言)\s+[::\s]?\s*(.{1,60})\s*$'

# ========== ChromaDB 向量存储配置 ==========
vector_store:
  # 存储路径（相对于项目根目录）
  path: "workspace/db/chromadb"
  
  # 集合名称
  collection_name: "novel_chunks"
  
  # 嵌入模型（向量化）
  embedding_model: "BAAI/bge-m3"
  dimensions: 1024
  
  # 批处理参数
  embed_batch_size: 10
  rate_limit: 100             # 每分钟请求数限制
  
# ========== 进度追踪 ==========
progress:
  show_progress_bar: true           # Visual progress indicator
  log_interval: 1                   # Log every N chapters
  save_intermediate: true           # Save partial results
  
# ========== 性能调优 ==========
performance:
  memory_limit_mb: 2048             # Max RAM usage
  disk_buffer_enabled: true         # Use disk for large buffers
  async_io: true                    # Use async I/O operations

# ========== 扩展功能 ==========
extensions:
  enable_custom_processors: false   # Allow custom processing modules
  custom_plugin_dirs: []            # Additional plugin directories

# Development settings
development:
  verbose_output: false             # Detailed processing output
  mock_api_responses: false         # Use mock responses for testing
  test_mode: false                  # Run in test mode
