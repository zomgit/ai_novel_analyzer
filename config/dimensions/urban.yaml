# Urban (都市) Novel Analysis Dimensions
title: "都市小说分析维度"
novel_type: "urban"
version: "1.0"

dimensions:
  # === 人物相关 ===
  - name: "主要人物"
    key: "character_names"
    description: "本章出现的主要人物"
    target_type: "entity"
    extraction_fields: ["name", "occupation", "background", "relationship_with_protagonist"]
    is_required: true
  
  - name: "人物关系"
    key: "relationships"
    description: "人物之间的关系发展"
    target_type: "relation"
    extraction_fields: ["person_a", "person_b", "relation_type", "development_stage"]
    is_required: false
  
  # === 事件相关 ===
  - name: "商业活动"
    key: "business_activities"
    description: "商业决策、交易、合作等"
    target_type: "event"
    extraction_fields: ["activity_type", "participants", "financial_impact", "outcome"]
    is_required: false
  
  - name: "冲突矛盾"
    key: "conflicts"
    description: "职场竞争、家庭矛盾等冲突"
    target_type: "event"
    extraction_fields: ["conflict_type", "involved_parties", "trigger", "resolution"]
    is_required: false
  
  - name: "情感线发展"
    key: "romantic_developments"
    description: "感情线的推进"
    target_type: "relation"
    extraction_fields: ["person_a", "person_b", "emotion_type", "progression", "obstacles"]
    is_required: false
  
  # === 场景相关 ===
  - name: "都市地点"
    key: "urban_locations"
    description: "城市中的地点场景"
    target_type: "entity"
    extraction_fields: ["location_name", "location_type", "description", "significance"]
    is_required: false
  
  - name: "社交场合"
    key: "social_occasions"
    description: "宴会、聚会、会议等社交活动"
    target_type: "event"
    extraction_fields: ["occasion_type", "attendees", "purpose", "outcome"]
    is_required: false
