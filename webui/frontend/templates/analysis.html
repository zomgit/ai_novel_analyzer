{% extends "base.html" %}

{% block title %}分析任务中心{% endblock %}

{% block content %}
<div x-data="analysisTaskCenter()" class="space-y-6">
    
    <!-- 标题栏 -->
    <div class="flex items-center justify-between">
        <h2 class="text-3xl font-bold text-gray-800">⚡ 分析任务中心</h2>
        <p class="text-sm text-gray-500">
            💡 在<b>拆书工坊</b>或<b>分析任务中心</b>点击「开始分析」后跳转到此页面查看进度
        </p>
    </div>
    
    <!-- 当前运行状态卡片 -->
    <div x-show="currentTask" class="bg-white p-6 rounded-xl shadow-md border border-blue-200">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-gray-800">🔥 当前任务：<span class="text-blue-600" x-text="currentTask?.task_id?.slice(0, 8)"></span></h3>
            <div class="flex items-center space-x-2">
                <span class="px-3 py-1 rounded-full text-sm font-medium"
                      :class="{
                          'bg-green-100 text-green-700': currentTask?.status === 'completed',
                          'bg-blue-100 text-blue-700': currentTask?.status === 'running',
                          'bg-yellow-100 text-yellow-700': currentTask?.status === 'queued',
                          'bg-red-100 text-red-700': currentTask?.status === 'failed'
                      }"
                      x-text="currentTask?.status">
                </span>
            </div>
        </div>
        
        <!-- 进度条 -->
        <div class="mb-4">
            <div class="flex justify-between text-sm text-gray-600 mb-2">
                <span>整体进度</span>
                <span><span x-text="currentTask?.progress || 0"></span>%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                <div class="h-4 rounded-full transition-all duration-500 bg-gradient-to-r from-blue-500 to-blue-600"
                     :style="`width: ${currentTask?.progress || 0}%`"></div>
            </div>
        </div>
        
        <!-- 日志输出区域 -->
        <div class="bg-gray-900 rounded-lg p-4 h-64 overflow-y-auto scrollbar-thin font-mono text-sm">
            <div class="text-green-400">● 正在连接日志流...</div>
            <template x-for="log in logs" :key="log.timestamp">
                <div class="text-gray-300">
                    <span class="text-gray-500">[${log.timestamp}]</span>
                    <span x-html="formatLog(log.message)"></span>
                </div>
            </template>
            <div x-show="connectingSSE" class="text-yellow-400 animate-pulse">● 重新连接 SSE 中...</div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="mt-4 flex space-x-3">
            <button @click="stopTask()" :disabled="!isRunning" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50">
                ⏹️ 停止任务
            </button>
            <button @click="clearLogs()" :disabled="logs.length === 0" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 disabled:opacity-50">
                🗑️ 清空日志
            </button>
        </div>
    </div>
    
    <!-- 章节统计网格 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h4 class="text-sm font-semibold text-gray-500 mb-3">已处理章节</h4>
            <p class="text-3xl font-bold text-blue-600" x-text="stats.completed_chapters"></p>
            <p class="text-xs text-gray-400 mt-2">成功率：<span x-text="(stats.completed_chapters / stats.total_chapters * 100 || 0).toFixed(1) + '%'"></span></p>
        </div>
        
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h4 class="text-sm font-semibold text-gray-500 mb-3">待处理章节</h4>
            <p class="text-3xl font-bold text-yellow-600" x-text="stats.pending_chapters"></p>
            <p class="text-xs text-gray-400 mt-2">预计耗时：<span x-text="formatDuration(stats.pending_chapters * 30)"></span></p>
        </div>
        
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h4 class="text-sm font-semibold text-gray-500 mb-3">失败重试</h4>
            <p class="text-3xl font-bold text-red-600" x-text="stats.failed_chapters"></p>
            <button @click="retryFailed()" class="mt-2 text-xs text-blue-600 hover:text-blue-800">
                → 一键重试
            </button>
        </div>
    </div>
    
    <!-- 分卷进度详情 -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
        <h3 class="text-lg font-bold text-gray-800 mb-4">📊 分卷处理进度</h3>
        
        <div class="overflow-y-auto max-h-96 scrollbar-thin">
            <template x-for="volume in volumeStats" :key="volume.id">
                <div class="border-b border-gray-100 last:border-0 pb-4 mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="font-semibold text-gray-700" x-text="volume.name"></h4>
                        <div class="text-sm text-gray-500">
                            <span class="text-green-600" x-text="volume.completed + ' ✓'"></span> /
                            <span class="text-gray-500" x-text="volume.total + ' 总'"></span>
                        </div>
                    </div>
                    
                    <!-- 详细进度条 -->
                    <div class="relative w-full bg-gray-200 rounded-full h-3">
                        <div class="absolute left-0 top-0 h-full bg-gradient-to-r from-green-400 to-green-500 rounded-full transition-all duration-500"
                             :style="`width: ${(volume.completed / volume.total * 100)}%`"></div>
                        <div class="relative z-10 flex items-center justify-end pr-2">
                            <span class="text-xs font-semibold text-gray-700" 
                                  x-text="(volume.completed / volume.total * 100 || 0).toFixed(0) + '%'"></span>
                        </div>
                    </div>
                    
                    <!-- 章节列表 -->
                    <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <template x-for="chap in volume.chapters.slice(0, 8)" :key="chap.id">
                            <div class="text-xs flex items-center space-x-2 px-2 py-1 rounded"
                                 :class="{
                                     'bg-green-50 text-green-700': chap.status === 'completed',
                                     'bg-blue-50 text-blue-700': chap.status === 'processing',
                                     'bg-gray-50 text-gray-500': chap.status === 'pending',
                                     'bg-red-50 text-red-700': chap.status === 'failed'
                                 }">
                                <span x-text="chap.id"></span>
                                <span x-text="chap.name"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
    
    <!-- 历史任务记录 -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
        <h3 class="text-lg font-bold text-gray-800 mb-4">🕐 历史任务</h3>
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-200">
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">#</th>
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">任务名称</th>
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">状态</th>
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">进度</th>
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">耗时</th>
                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">时间</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="(task, idx) in historyTasks" :key="idx">
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-3 px-4 text-sm text-gray-500" x-text="idx + 1"></td>
                        <td class="py-3 px-4 text-sm font-medium" x-text="task.name"></td>
                        <td class="py-3 px-4 text-sm">
                            <span class="px-2 py-1 rounded-full text-xs font-medium"
                                  :class="{
                                      'bg-green-100 text-green-700': task.status === 'completed',
                                      'bg-blue-100 text-blue-700': task.status === 'running',
                                      'bg-yellow-100 text-yellow-700': task.status === 'queued',
                                      'bg-red-100 text-red-700': task.status === 'failed'
                                  }"
                                  x-text="task.status">
                            </span>
                        </td>
                        <td class="py-3 px-4 text-sm">
                            <div class="flex items-center gap-2">
                                <div class="w-20 bg-gray-200 rounded-full h-2">
                                    <div class="h-2 rounded-full transition-all" 
                                         :class="task.status === 'completed' ? 'bg-green-500' : 'bg-blue-500'"
                                         :style="`width: ${task.progress}%`"></div>
                                </div>
                                <span class="text-xs" x-text="task.progress + '%'"></span>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600" x-text="formatDuration(task.duration_seconds)"></td>
                        <td class="py-3 px-4 text-sm text-gray-500" x-text="formatDateTime(task.end_time)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    
</div>

<script>
function analysisTaskCenter() {
    return {
        isRunning: false,
        currentTask: null,
        logs: [],
        reconnectAttempts: 0,
        maxReconnectAttempts: 5,
        volumeStats: [],
        historyTasks: [],
        connectingSSE: false,
        stats: {
            total_chapters: 0,
            completed_chapters: 0,
            pending_chapters: 0,
            failed_chapters: 0
        },
        
        async init() {
            // 检查 URL 中的 task_id 参数（用于从拆书工坊跳转）
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('task_id');
            
            if (taskId) {
                // 如果有 task_id，直接连接该任务的 SSE 日志
                this.currentTask = {
                    task_id: taskId,
                    status: 'queued',
                    progress: 0
                };
                this.isRunning = true;
                this.connectSSE(taskId);
                // 移除 URL 参数（避免刷新后重复连接）
                window.history.replaceState({}, '', '/analysis');
            }
            
            await this.loadData();
            // 定时刷新
            setInterval(() => this.loadData(), 10000);
        },
        
        async loadData() {
            // 加载统计数据
            try {
                const [statsRes, progressRes] = await Promise.all([
                    fetch('/api/stats'),
                    fetch('/scripts/check_progress')
                ]);
                
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    this.stats = stats;
                }
                
                if (progressRes.ok) {
                    const progressData = await progressRes.json();
                    this.volumeStats = progressData.volumes || [];
                }
            } catch (err) {
                console.error('加载数据失败:', err);
            }
        },
        
        connectSSE(taskId) {
            const eventSource = new EventSource(`/api/tasks/${taskId}/log`);
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    this.addLog(data.message);
                    this.currentTask = { ...this.currentTask, ...data };
                    
                    if (data.status === 'completed') {
                        this.isRunning = false;
                        this.addLog('✅ 分析任务已完成');
                        // 任务完成后刷新统计数据
                        setTimeout(() => this.loadData(), 2000);
                        eventSource.close();
                    }
                    if (data.status === 'failed') {
                        this.isRunning = false;
                        this.addLog('❌ 分析任务失败：' + (data.error || '未知错误'));
                        eventSource.close();
                    }
                } catch (err) {
                    // 纯文本日志
                    this.addLog(event.data);
                }
            };
            
            eventSource.onerror = () => {
                eventSource.close();
                this.connectingSSE = true;
                this.reconnectAttempts++;
                
                if (this.reconnectAttempts <= this.maxReconnectAttempts) {
                    setTimeout(() => {
                        console.log(`重连尝试 ${this.reconnectAttempts}`);
                        this.connectSSE(taskId);
                    }, 2000);
                } else {
                    this.addLog('SSE 连接断开，请手动刷新页面');
                }
            };
        },
        
        addLog(message) {
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            this.logs.push({ timestamp, message });
            
            // 限制日志数量
            if (this.logs.length > 1000) {
                this.logs.shift();
            }
        },
        
        formatLog(message) {
            // 高亮关键词
            return message
                .replace(/成功/gi, '<span class="text-green-400">成功</span>')
                .replace(/失败/gi, '<span class="text-red-400">失败</span>')
                .replace(/警告/gi, '<span class="text-yellow-400">警告</span>');
        },
        
        clearLogs() {
            this.logs = [];
        },
        
        stopTask() {
            // TODO: 实现真正的停止逻辑
            this.isRunning = false;
            this.currentTask = null;
            this.addLog('任务已停止');
        },
        
        retryFailed() {
            alert('功能开发中：将筛选出所有标记为“失败”的章节并重新执行分析流程');
        },
        
        formatDuration(seconds) {
            if (!seconds) return '0s';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        },
        
        formatDateTime(timestamp) {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleString('zh-CN');
        }
    };
}
</script>
{% endblock %}
